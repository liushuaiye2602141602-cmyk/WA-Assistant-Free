<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WhatsApp 助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>WhatsApp 助手</h1>
        <p class="sub">v2.3.2 · 快捷回复 · 聊天备份</p>
      </div>
    </div>
  </header>
  <main>
    <div class="card">
      <p class="hint" id="status">检测 WhatsApp Web…</p>
      <button id="btn-open" class="btn primary">打开助手面板</button>
      <button id="btn-export-active" class="btn">导出当前聊天</button>
      <button id="btn-open-wa" class="btn ghost">打开 WhatsApp Web</button>
    </div>
    <div class="card tips">
      <h2>开始使用</h2>
      <ol>
        <li>登录 <b>web.whatsapp.com</b> 并刷新</li>
        <li>点聊天栏绿色按钮打开面板</li>
        <li>选择需要使用的功能</li>
        <li>勾选聊天，导出记录与语音等附件</li>
      </ol>
      <p class="hint">打开面板后可切换备份、批量发送、联系人和隐私保护。</p>
    </div>
  </main>
  <p style="padding: 0 16px 12px"><a href="../disclaimer.html" target="_blank" rel="noopener">免责声明 / Disclaimer · 中文 / English</a></p>
  <script src="popup.js"></script>
</body>
</html>
